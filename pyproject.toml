[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadway-observer"
version = "1.1.0"
description = "Production-grade roadway observation system with RTSP, object detection, and web dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "roadway-observer team"}
]
keywords = ["rtsp", "object-detection", "tensorflow-lite", "flask", "surveillance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ai-edge-litert>=2.0.0",
    "tensorflow>=2.21.0",
    "opencv-python-headless>=5.0.0",
    "flask>=3.0.0",
    "pyyaml>=6.0",
    "numpy>=2.0.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/roadway-observer"
Repository = "https://github.com/yourusername/roadway-observer"

[project.scripts]
roadway-observer = "src.main:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]